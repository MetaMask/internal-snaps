name: Lint, Build, and Test

on:
  workflow_call:
    secrets:
      RPC_URL_LIST_MAINNET:
        required: false
      RPC_URL_LIST_NILE_TESTNET:
        required: false
      RPC_URL_LIST_SHASTA_TESTNET:
        required: false
      PRICE_API_BASE_URL:
        required: false
      LOCAL_API_BASE_URL:
        required: false
      TOKEN_API_BASE_URL:
        required: false
      STATIC_API_BASE_URL:
        required: false
      SECURITY_ALERTS_API_BASE_URL:
        required: false
      NFT_API_BASE_URL:
        required: false
      EXPLORER_MAINNET_BASE_URL:
        required: false
      EXPLORER_NILE_BASE_URL:
        required: false
      EXPLORER_SHASTA_BASE_URL:
        required: false
      TRONGRID_BASE_URL_MAINNET:
        required: false
      TRONGRID_BASE_URL_NILE:
        required: false
      TRONGRID_BASE_URL_SHASTA:
        required: false
      TRON_HTTP_BASE_URL_MAINNET:
        required: false
      TRON_HTTP_BASE_URL_NILE:
        required: false
      TRON_HTTP_BASE_URL_SHASTA:
        required: false

env:
  ENVIRONMENT: production
  RPC_URL_LIST_MAINNET: ${{ secrets.RPC_URL_LIST_MAINNET }}
  RPC_URL_LIST_NILE_TESTNET: ${{ secrets.RPC_URL_LIST_NILE_TESTNET }}
  RPC_URL_LIST_SHASTA_TESTNET: ${{ secrets.RPC_URL_LIST_SHASTA_TESTNET }}
  PRICE_API_BASE_URL: ${{ secrets.PRICE_API_BASE_URL }}
  LOCAL_API_BASE_URL: ${{ secrets.LOCAL_API_BASE_URL }}
  TOKEN_API_BASE_URL: ${{ secrets.TOKEN_API_BASE_URL }}
  STATIC_API_BASE_URL: ${{ secrets.STATIC_API_BASE_URL }}
  SECURITY_ALERTS_API_BASE_URL: ${{ secrets.SECURITY_ALERTS_API_BASE_URL }}
  NFT_API_BASE_URL: ${{ secrets.NFT_API_BASE_URL }}
  EXPLORER_MAINNET_BASE_URL: ${{ secrets.EXPLORER_MAINNET_BASE_URL }}
  EXPLORER_NILE_BASE_URL: ${{ secrets.EXPLORER_NILE_BASE_URL }}
  EXPLORER_SHASTA_BASE_URL: ${{ secrets.EXPLORER_SHASTA_BASE_URL }}
  TRONGRID_BASE_URL_MAINNET: ${{ secrets.TRONGRID_BASE_URL_MAINNET }}
  TRONGRID_BASE_URL_NILE: ${{ secrets.TRONGRID_BASE_URL_NILE }}
  TRONGRID_BASE_URL_SHASTA: ${{ secrets.TRONGRID_BASE_URL_SHASTA }}
  TRON_HTTP_BASE_URL_MAINNET: ${{ secrets.TRON_HTTP_BASE_URL_MAINNET }}
  TRON_HTTP_BASE_URL_NILE: ${{ secrets.TRON_HTTP_BASE_URL_NILE }}
  TRON_HTTP_BASE_URL_SHASTA: ${{ secrets.TRON_HTTP_BASE_URL_SHASTA }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    outputs:
      child-workspace-package-names: ${{ steps.workspace-package-names.outputs.child-workspace-package-names }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: false
          cache-node-modules: true
          node-version: ${{ matrix.node-version }}
      - name: Fetch workspace package names
        id: workspace-package-names
        run: |
          echo "child-workspace-package-names=$(yarn workspaces list --no-private --json | jq --slurp --raw-output 'map(.name) | @json')" >> "$GITHUB_OUTPUT"
        shell: bash

  lint:
    name: Lint (${{ matrix.script }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        node-version: [24.x]
        script:
          - lint:eslint
          - lint:misc:check
          - constraints
          - lint:dependencies
          - readme-content:check
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: false
          node-version: ${{ matrix.node-version }}
      - name: Run yarn ${{ matrix.script }}
        run: yarn "$SCRIPT"
        env:
          SCRIPT: ${{ matrix.script }}
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  validate-changelog:
    name: Validate changelog
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        node-version: [24.x]
        package-name: ${{ fromJson(needs.prepare.outputs.child-workspace-package-names) }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: false
          node-version: ${{ matrix.node-version }}
      - run: yarn workspace ${{ matrix.package-name }} changelog:validate
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  validate-changelog-diffs:
    name: Validate changelog diffs
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate changelog diffs
        uses: ./.github/actions/check-merge-queue-changelogs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: false
          node-version: ${{ matrix.node-version }}
      - run: yarn build
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  test-scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: false
          node-version: ${{ matrix.node-version }}
      - run: yarn test:scripts
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        node-version: [20.x, 22.x]
        package-name: ${{ fromJson(needs.prepare.outputs.child-workspace-package-names) }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: false
          node-version: ${{ matrix.node-version }}
      - name: Build for tests
        run: yarn workspace ${{ matrix.package-name }} build
      - run: yarn workspace ${{ matrix.package-name }} run test
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi
