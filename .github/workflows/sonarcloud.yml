name: SonarCloud

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: SonarCloud token
        required: true

jobs:
  sonarcloud-scan:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout and setup environment
        # This is MetaMask/action-checkout-and-setup@v3
        uses: MetaMask/action-checkout-and-setup@0543b5929698c71e3ccc6ed24eac87825669b5de
        with:
          is-high-risk-environment: false
          # SonarCloud needs the full history for new-code and blame data
          fetch-depth: 0
          node-version: 24.x

      # This workflow runs in parallel with (not after) the test matrix, so it
      # generates its own coverage instead of consuming coverage artifacts.
      - name: Build packages
        run: yarn build

      - name: Run tests with coverage
        # Jest is configured with `collectCoverage: true` and an lcov reporter,
        # so this writes packages/<package>/coverage/lcov.info for every
        # workspace package.
        run: yarn workspaces foreach --all --no-private --parallel --interlaced run test

      - name: Rewrite coverage paths for SonarCloud
        # Jest writes "SF:" paths relative to the package, but SonarCloud
        # resolves them against the repo root, so prefix them with the
        # package directory.
        run: |
          for lcov_file in packages/*/coverage/lcov.info; do
            if [ -f "$lcov_file" ]; then
              package_directory="$(basename "$(dirname "$(dirname "$lcov_file")")")"
              sed -i.bak "s|^SF:|SF:packages/${package_directory}/|" "$lcov_file"
              rm "${lcov_file}.bak"
            else
              echo "No coverage report found at $lcov_file"
            fi
          done
        shell: bash

      - name: SonarCloud scan
        # This is SonarSource/sonarqube-scan-action@v7.1.0
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
