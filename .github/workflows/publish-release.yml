name: Publish Release

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: true
      LOG_LEVEL:
        required: false
      DEFAULT_ADDRESS_TYPE:
        required: false
      ESPLORA_BITCOIN:
        required: false
      ESPLORA_TESTNET:
        required: false
      ESPLORA_TESTNET4:
        required: false
      ESPLORA_SIGNET:
        required: false
      ESPLORA_REGTEST:
        required: false
      PRICE_API_URL:
        required: false
      PRICE_API_BASE_URL:
        required: false
      RPC_URL_LIST_MAINNET:
        required: false
      RPC_URL_LIST_NILE_TESTNET:
        required: false
      RPC_URL_LIST_SHASTA_TESTNET:
        required: false
      LOCAL_API_BASE_URL:
        required: false
      TOKEN_API_BASE_URL:
        required: false
      STATIC_API_BASE_URL:
        required: false
      SECURITY_ALERTS_API_BASE_URL:
        required: false
      NFT_API_BASE_URL:
        required: false
      EXPLORER_MAINNET_BASE_URL:
        required: false
      EXPLORER_NILE_BASE_URL:
        required: false
      EXPLORER_SHASTA_BASE_URL:
        required: false
      TRONGRID_BASE_URL_MAINNET:
        required: false
      TRONGRID_BASE_URL_NILE:
        required: false
      TRONGRID_BASE_URL_SHASTA:
        required: false
      TRON_HTTP_BASE_URL_MAINNET:
        required: false
      TRON_HTTP_BASE_URL_NILE:
        required: false
      TRON_HTTP_BASE_URL_SHASTA:
        required: false

permissions:
  contents: read

concurrency:
  group: publish-release
  queue: max

jobs:
  publish-release:
    environment: default-branch
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: true
      - uses: MetaMask/action-publish-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn build
        env:
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DEFAULT_ADDRESS_TYPE: ${{ secrets.DEFAULT_ADDRESS_TYPE }}
          ESPLORA_BITCOIN: ${{ secrets.ESPLORA_BITCOIN }}
          ESPLORA_TESTNET: ${{ secrets.ESPLORA_TESTNET }}
          ESPLORA_TESTNET4: ${{ secrets.ESPLORA_TESTNET4 }}
          ESPLORA_SIGNET: ${{ secrets.ESPLORA_SIGNET }}
          ESPLORA_REGTEST: ${{ secrets.ESPLORA_REGTEST }}
          PRICE_API_URL: ${{ secrets.PRICE_API_URL }}
          PRICE_API_BASE_URL: ${{ secrets.PRICE_API_BASE_URL }}
          ENVIRONMENT: production
          RPC_URL_LIST_MAINNET: ${{ secrets.RPC_URL_LIST_MAINNET }}
          RPC_URL_LIST_NILE_TESTNET: ${{ secrets.RPC_URL_LIST_NILE_TESTNET }}
          RPC_URL_LIST_SHASTA_TESTNET: ${{ secrets.RPC_URL_LIST_SHASTA_TESTNET }}
          LOCAL_API_BASE_URL: ${{ secrets.LOCAL_API_BASE_URL }}
          TOKEN_API_BASE_URL: ${{ secrets.TOKEN_API_BASE_URL }}
          STATIC_API_BASE_URL: ${{ secrets.STATIC_API_BASE_URL }}
          SECURITY_ALERTS_API_BASE_URL: ${{ secrets.SECURITY_ALERTS_API_BASE_URL }}
          NFT_API_BASE_URL: ${{ secrets.NFT_API_BASE_URL }}
          EXPLORER_MAINNET_BASE_URL: ${{ secrets.EXPLORER_MAINNET_BASE_URL }}
          EXPLORER_NILE_BASE_URL: ${{ secrets.EXPLORER_NILE_BASE_URL }}
          EXPLORER_SHASTA_BASE_URL: ${{ secrets.EXPLORER_SHASTA_BASE_URL }}
          TRONGRID_BASE_URL_MAINNET: ${{ secrets.TRONGRID_BASE_URL_MAINNET }}
          TRONGRID_BASE_URL_NILE: ${{ secrets.TRONGRID_BASE_URL_NILE }}
          TRONGRID_BASE_URL_SHASTA: ${{ secrets.TRONGRID_BASE_URL_SHASTA }}
          TRON_HTTP_BASE_URL_MAINNET: ${{ secrets.TRON_HTTP_BASE_URL_MAINNET }}
          TRON_HTTP_BASE_URL_NILE: ${{ secrets.TRON_HTTP_BASE_URL_NILE }}
          TRON_HTTP_BASE_URL_SHASTA: ${{ secrets.TRON_HTTP_BASE_URL_SHASTA }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: publish-release-artifacts-${{ github.sha }}
          include-hidden-files: true
          retention-days: 4
          path: |
            ./packages/**/dist
            ./node_modules/.yarn-state.yml

  publish-npm-dry-run:
    name: Dry run publish to NPM
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: true
          ref: ${{ github.sha }}
      - name: Restore build artifacts
        uses: actions/download-artifact@v7
        with:
          name: publish-release-artifacts-${{ github.sha }}
      - name: Dry run publish to NPM
        uses: MetaMask/action-npm-publish@v6
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          subteam: S042S7RE4AE # @metamask-npm-publishers

  publish-npm:
    name: Publish to NPM
    environment: npm-publish
    runs-on: ubuntu-latest
    needs: publish-npm-dry-run
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v2
        with:
          is-high-risk-environment: true
          ref: ${{ github.sha }}
      - name: Restore build artifacts
        uses: actions/download-artifact@v7
        with:
          name: publish-release-artifacts-${{ github.sha }}
      - name: Publish to NPM
        uses: MetaMask/action-npm-publish@v6
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
